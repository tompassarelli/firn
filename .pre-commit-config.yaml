repos:
  - repo: local
    hooks:
      - id: hardcoded-repo-path-check
        name: hard-coded repository path check
        entry: env -u HARDCODED_REPO_PATH_CHECK_ROOTS dotfiles/bin/hardcoded-repo-path-check
        language: system
        pass_filenames: false
        always_run: true
      # Git hooks cannot be tracked, so the installer is: any verified commit
      # (re)points .git/hooks/reference-transaction at the prewarm.
      - id: firn-prewarm-hook
        name: firn prewarm ref-transaction hook
        entry: bash -c '"$PWD/dotfiles/bin/firn-prewarm" --install-hook'
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
