default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: firn-check
        name: firn check
        entry: dotfiles/bin/firn-check
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: hardcoded-repo-path-check
        name: hard-coded repository path check
        entry: bash -c 'HARDCODED_REPO_PATH_CHECK_ROOTS="$PWD" exec north hardcoded-repo-path-check'
        language: system
        pass_filenames: false
        always_run: true
      - id: betterleaks
        name: betterleaks
        entry: betterleaks git --pre-commit --staged --redact --no-banner --trust-local-git-config --config .betterleaks.toml
        language: system
        pass_filenames: false
