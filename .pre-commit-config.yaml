repos:
  - repo: local
    hooks:
      - id: world-topology-drift
        name: world topology drift
        entry: >-
          bash -c 'roots="$PWD:$("$PWD/dotfiles/bin/world" get repo.north):$("$PWD/dotfiles/bin/world" get repo.fram):$("$PWD/dotfiles/bin/world" get repo.beagle)";
          WORLD_LINT_ROOTS="$roots" WORLD_LINT_FAIL=1 "$PWD/dotfiles/bin/world" check --lint'
        language: system
        pass_filenames: false
        always_run: true
      # Git hooks cannot be tracked, so the installer is: any verified commit
      # (re)points .git/hooks/reference-transaction at the prewarm.
      - id: firn-prewarm-hook
        name: firn prewarm ref-transaction hook
        entry: bash -c '"$PWD/dotfiles/bin/firn-prewarm" --install-hook'
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
