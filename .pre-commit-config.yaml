default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: firn-check
        name: firn check
        entry: dotfiles/bin/firn-check
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: hardcoded-repo-path-check
        name: hard-coded repository path check
        entry: env -u HARDCODED_REPO_PATH_CHECK_ROOTS hardcoded-repo-path-check
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
