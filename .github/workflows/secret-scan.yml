name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BETTERLEAKS_SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache betterleaks release
        id: betterleaks-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/betterleaks.tar.gz
          key: betterleaks-${{ env.BETTERLEAKS_SHA256 }}

      - name: Download betterleaks release
        if: steps.betterleaks-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o "$RUNNER_TEMP/betterleaks.tar.gz" https://github.com/betterleaks/betterleaks/releases/download/v1.10.0/betterleaks_1.10.0_linux_x64.tar.gz

      - name: Install betterleaks
        run: |
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/betterleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" betterleaks

      - name: Scan history
        run: ./betterleaks git --redact --no-banner --trust-local-git-config --config .betterleaks.toml
