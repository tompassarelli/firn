name: Main is red
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: main-red
  cancel-in-progress: false
jobs:
  sheriff:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Confirm or report the failed landing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898183+github-actions[bot]@users.noreply.github.com'
          bun native/main-red.ts "$CI_RUN"
