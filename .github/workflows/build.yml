name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05
          # Mirror the substituters from modules/nix-settings/default.bnix.
          # Without these, CI builds every derivation from source; local
          # builds finish in ~2 min because they fetch pre-built paths.
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org https://walker.cachix.org https://walker-git.cachix.org https://devenv.cachix.org https://quickshell.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= walker.cachix.org-1:fG8q+uAaMqhsMxWjwvk0IMb4mFPFLqHjuvfwQxE4oJM= walker-git.cachix.org-1:vmC0ocfPWh0S/vRAQGtChuiZBTAe4wiKDeyyXM0/7pM= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= quickshell.cachix.org-1:vBm3s5tZThc5KDLj6zhHVCMp8wX/AZJwle9wqdi81ts=
            # Authenticate nix's github API calls. The `--override-input … github:…`
            # below resolve each repo's HEAD via api.github.com; unauthenticated that
            # hits the 60/hr rate limit -> HTTP 429. The runner's GITHUB_TOKEN lifts
            # it to 5000/hr. (All overridden repos are same-owner, so the token has read.)
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Build whiterabbit
        # beagle/fram/lodestar are authored as local `git+file:///home/tom/...`
        # inputs (fast local iteration on the sibling repos). CI can't fetch a
        # path on the author's machine, so override each to its public github
        # mirror for the build. Local `firn rebuild` keeps using the file:// paths.
        # (palefox is already a github input — no override needed.)
        run: |
          nix build .#nixosConfigurations.whiterabbit.config.system.build.toplevel \
            --override-input beagle github:tompassarelli/beagle \
            --override-input fram github:tompassarelli/fram \
            --override-input lodestar github:tompassarelli/lodestar \
            --override-input lodestar/fram github:tompassarelli/fram
          # lodestar's own flake.nix hardcodes `fram.url = "path:/home/tom/code/fram"`
          # (a local path leaked into a published flake) and builds fram-engine from
          # it, so overriding the top-level fram isn't enough — the TRANSITIVE
          # lodestar/fram must be overridden too. Real fix belongs in lodestar's
          # flake (point fram at github or follow the consumer's input).
