name: Agent harness config
# Anti-rot gate for Firn-owned profile fragments plus the Codex adapter.
# The Drift check (tests.yml) only governs .bnix<->.nix; this validates the
# dotfile content that actually injects behavior into every agent session.
on:
  push:
    branches: [main]
    paths:
      - 'dotfiles/codex/**'
      - 'dotfiles/bin/codex'
      - 'dotfiles/bin/launcher.test.sh'
      - 'modules/codex/**'
      - 'modules/agent-core/**'
      - 'scripts/agent-config-check.sh'
      - 'scripts/agent-config-check.test.sh'
      - 'scripts/agent-provider-status.sh'
      - 'scripts/agent-provider-status.test.sh'
      - '.github/workflows/agent-config.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dotfiles/codex/**'
      - 'dotfiles/bin/codex'
      - 'dotfiles/bin/launcher.test.sh'
      - 'modules/codex/**'
      - 'modules/agent-core/**'
      - 'scripts/agent-config-check.sh'
      - 'scripts/agent-config-check.test.sh'
      - 'scripts/agent-provider-status.sh'
      - 'scripts/agent-provider-status.test.sh'
      - '.github/workflows/agent-config.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure checker dependencies
        run: |
          missing=()
          command -v shellcheck >/dev/null 2>&1 || missing+=(shellcheck)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          command -v rg >/dev/null 2>&1 || missing+=(ripgrep)
          if (( ${#missing[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Validate agent harness config
        run: ./scripts/agent-config-check.sh
      - name: Test Codex identity boundaries
        run: bash ./scripts/agent-config-check.test.sh
      - name: Test provider status contract
        run: ./scripts/agent-provider-status.test.sh
