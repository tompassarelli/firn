name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: firn

      - name: Checkout beagle
        uses: actions/checkout@v4
        with:
          repository: tompassarelli/beagle
          path: beagle

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05

      - name: Install Racket
        # Base racket on PATH; the link + drift steps below override it with
        # beagle's flake-pinned racket via _beagle-racket.
        run: nix profile install nixpkgs#racket

      - name: Link beagle package (beagle's pinned racket — MUST match the compiler)
        # The compiler sources beagle/bin/_beagle-racket and runs under beagle's
        # flake-pinned racket. beagle-lib MUST be linked with that SAME racket,
        # or the collection lands in nixpkgs#racket's package DB and the compiler
        # dies under the pinned racket with "collection not found: beagle/private/*".
        # (nixpkgs#racket and beagle's pin are versioned independently — 9.2 vs 9.1.)
        # _beagle-racket's PLTCOLLECTS scope aliases `beagle` onto `beagle-lib`;
        # raco refuses both as one directory, so set up by package with it unset.
        run: |
          source "$GITHUB_WORKSPACE/beagle/bin/_beagle-racket"
          PLTCOLLECTS='' "$RACO" pkg install --auto --batch --link --force "$GITHUB_WORKSPACE/beagle/beagle-lib"
          PLTCOLLECTS='' "$RACO" setup --pkgs beagle-lib

      - name: Drift check (.bnix and .nix in sync)
        # Regenerates every .nix from its sibling .bnix and fails if any
        # generated file differs from what's committed. Forces .bnix to
        # remain the source of truth.
        working-directory: firn
        env:
          BEAGLE_PATH: ${{ github.workspace }}/beagle
        run: |
          FIRN_REPO="$PWD" "$PWD/dotfiles/bin/firn" repo build
          if ! git diff --exit-code; then
            echo "::error::Generated .nix files don't match .bnix sources. Run 'firn repo build' locally and commit."
            exit 1
          fi

      - name: Test retained repository build route
        working-directory: firn
        env:
          BEAGLE_PATH: ${{ github.workspace }}/beagle
        run: bash native/repo_build_native.test.sh

      - name: Test safe-push argument gate
        working-directory: firn
        run: ./dotfiles/bin/safe-push.test.sh
