name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: firn

      - name: Checkout beagle (sibling clone — firn-build expects ../beagle)
        uses: actions/checkout@v4
        with:
          repository: tompassarelli/beagle
          path: beagle

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05

      - name: Install Racket
        # Base racket on PATH; the link + drift steps below override it with
        # beagle's flake-pinned racket via _beagle-racket.
        run: nix profile install nixpkgs#racket

      - name: Link beagle package (beagle's pinned racket — MUST match firn-build)
        # firn-build sources beagle/bin/_beagle-racket and runs under beagle's
        # flake-pinned racket. beagle-lib MUST be linked with that SAME racket,
        # or the collection lands in nixpkgs#racket's package DB and firn-build
        # dies under the pinned racket with "collection not found: beagle/private/*".
        # (nixpkgs#racket and beagle's pin are versioned independently — 9.2 vs 9.1.)
        run: |
          source "$GITHUB_WORKSPACE/beagle/bin/_beagle-racket"
          "$RACO" pkg install --auto --batch --link --force "$GITHUB_WORKSPACE/beagle/beagle-lib"
          "$RACO" setup beagle

      - name: Drift check (.bnix and .nix in sync)
        # Regenerates every .nix from its sibling .bnix and fails if any
        # generated file differs from what's committed. Forces .bnix to
        # remain the source of truth.
        working-directory: firn
        env:
          BEAGLE_PATH: ${{ github.workspace }}/beagle
        run: |
          ./scripts/firn-build
          if ! git diff --exit-code; then
            echo "::error::Generated .nix files don't match .bnix sources. Run firn-build locally and commit."
            exit 1
          fi

      - name: Test Firn CLI contracts
        working-directory: firn
        run: |
          source "$GITHUB_WORKSPACE/beagle/bin/_beagle-racket"
          "$RACO" test scripts/firn-cmds/doctor.rkt
          "$RACO" test scripts/firn-cmds/diff.rkt
          ./scripts/firn-build-bin.test.sh
          ./scripts/firn-schema-input-fingerprint.test.sh

      - name: Test safe-push argument gate
        working-directory: firn
        run: ./dotfiles/bin/safe-push.test.sh
