name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {suite: runtime, shard: 0, name: runtime}
          - {suite: drift, shard: 0, name: drift}
          - {suite: discovered, shard: 0, name: discovered 1/2}
          - {suite: discovered, shard: 1, name: discovered 2/2}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: firn
          fetch-depth: 0

      - name: Checkout beagle
        uses: actions/checkout@v4
        with:
          repository: tompassarelli/beagle
          path: beagle

      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05

      - name: Read setup identities
        id: setup
        run: |
          echo "beagle=$(git -C beagle rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "galileo=$(cat firn/config/galileo-revision)" >> "$GITHUB_OUTPUT"
          nix flake metadata nixpkgs --json > "$RUNNER_TEMP/test-tools-lock.json"
          echo "tools-url=$(jq -r .url "$RUNNER_TEMP/test-tools-lock.json")" >> "$GITHUB_OUTPUT"
          tools_key=$(jq -r .locked.narHash "$RUNNER_TEMP/test-tools-lock.json" | sha256sum | cut -d' ' -f1)
          echo "tools-key=$tools_key" >> "$GITHUB_OUTPUT"

      - name: Checkout galileo
        uses: actions/checkout@v4
        with:
          repository: tompassarelli/galileo
          ref: ${{ steps.setup.outputs.galileo }}
          path: galileo

      - name: Cache test tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-tools
          key: tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.tools-key }}

      - name: Install test tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        env:
          TOOLS_URL: ${{ steps.setup.outputs.tools-url }}
        run: |
          mkdir -p "$RUNNER_TEMP/test-tools"
          nix build --no-link --print-out-paths "$TOOLS_URL#bun" "$TOOLS_URL#ripgrep" "$TOOLS_URL#jq" \
            > "$RUNNER_TEMP/test-tools/paths"
          mapfile -t tools < "$RUNNER_TEMP/test-tools/paths"
          mapfile -t closure < <(nix-store --query --requisites "${tools[@]}")
          nix-store --export "${closure[@]}" > "$RUNNER_TEMP/test-tools/closure.nar"

      - name: Activate test tools
        run: |
          nix-store --import < "$RUNNER_TEMP/test-tools/closure.nar" > /dev/null
          while IFS= read -r tool; do
            if [[ -d "$tool/bin" ]]; then
              echo "$tool/bin" >> "$GITHUB_PATH"
            fi
          done < "$RUNNER_TEMP/test-tools/paths"

      - name: Cache compiled Beagle collection and pinned Racket
        id: beagle-cache
        uses: actions/cache@v4
        with:
          path: |
            beagle/**/compiled
            beagle/.beagle
            ~/.local/share/racket
            ${{ runner.temp }}/beagle-cache
          key: beagle-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.beagle }}-${{ hashFiles('beagle/flake.lock') }}

      - name: Link beagle package with its pinned Racket
        if: steps.beagle-cache.outputs.cache-hit != 'true'
        # Racket bytecode and package links must use the compiler's pinned Racket.
        run: |
          mkdir -p "$RUNNER_TEMP/beagle-cache"
          source "$GITHUB_WORKSPACE/beagle/bin/_beagle-racket"
          PLTCOLLECTS='' "$RACO" pkg install --auto --batch --link --force "$GITHUB_WORKSPACE/beagle/beagle-lib"
          PLTCOLLECTS='' "$RACO" setup --pkgs beagle-lib
          printf '%s\n' "$RACKET" > "$RUNNER_TEMP/beagle-cache/racket-path"
          mapfile -t closure < <(nix-store --query --requisites "${RACKET%/bin/racket}")
          nix-store --export "${closure[@]}" > "$RUNNER_TEMP/beagle-cache/closure.nar"

      - name: Activate pinned Racket
        run: |
          nix-store --import < "$RUNNER_TEMP/beagle-cache/closure.nar" > /dev/null
          echo "_BEAGLE_RACKET=$(cat "$RUNNER_TEMP/beagle-cache/racket-path")" >> "$GITHUB_ENV"

      - name: Cache firn user runtime
        if: matrix.suite != 'runtime'
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/firn-runtime
            ${{ runner.temp }}/firn-runtime-closure.nar
          key: runtime-repo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.beagle }}-${{ steps.setup.outputs.tools-key }}-${{ hashFiles('firn/native/**', 'firn/config/galileo-revision', 'firn/dotfiles/bin/firn-runtime-update') }}

      - name: Install firn user runtime
        if: matrix.suite != 'runtime' && steps.runtime-cache.outputs.cache-hit != 'true'
        working-directory: firn
        env:
          BEAGLE_PATH: ${{ github.workspace }}/beagle
          FIRN_GALILEO_REPO: }/galileo
          FIRN_RUNTIME_ROOT: ${{ runner.temp }}/firn-runtime
        run: |
          FIRN_REPO="$PWD" "$PWD/dotfiles/bin/firn-runtime-update" repo
          mapfile -t roots < <(awk -F= '/^(bun_store_path|galileo_runtime_dependency)=\/nix\/store\// {print $2}' \
            "$FIRN_RUNTIME_ROOT/current/manifest")
          mapfile -t closure < <(nix-store --query --requisites "${roots[@]}")
          nix-store --export "${closure[@]}" > "$RUNNER_TEMP/firn-runtime-closure.nar"

      - name: Activate firn user runtime
        if: matrix.suite != 'runtime'
        run: nix-store --import < "$RUNNER_TEMP/firn-runtime-closure.nar" > /dev/null

      - name: Drift check (.bnix and .nix in sync)
        if: matrix.suite == 'drift'
        working-directory: firn
        env:
          BEAGLE_PATH: ${{ github.workspace }}/beagle
          FIRN_RUNTIME_ROOT: ${{ runner.temp }}/firn-runtime
        run: |
          FIRN_REPO="$PWD" "$PWD/dotfiles/bin/firn" repo build
          if ! git diff --exit-code; then
            echo "::error::Generated .nix files don't match .bnix sources. Run 'firn repo build' locally and commit."
            exit 1
          fi

      - name: Discovered shell tests
        if: matrix.suite != 'drift'
        working-directory: firn
        env:
          BEAGLE_PATH: ${{ github.workspace }}/beagle
          FIRN_GALILEO_REPO: }/galileo
          FIRN_RUNTIME_ROOT: ${{ runner.temp }}/firn-runtime
          FIRN_REAL_REPO: ${{ github.workspace }}/firn
          FIRN_TEST_SUITE: ${{ matrix.suite }}
          FIRN_TEST_SHARD: ${{ matrix.shard }}
          FIRN_TEST_SHARDS: 2
        run: |
          FIRN_BUN="$(command -v bun)"
          export FIRN_BUN
          skip=(
            modules/north-profile/default.test.sh # Needs the local North/South policy catalog and whiterabbit Home Manager realization.
            native/authoring_native.test.sh # needs the private Galileo compiler; public firn CI cannot check it out
          )
          mapfile -t tests < <(find dotfiles modules native -type f -name '*.test.sh' | LC_ALL=C sort)
          status=0
          index=0
          for test in "${tests[@]}"; do
            if printf '%s\n' "${skip[@]}" | grep -Fxq "$test"; then
              echo "::notice::$test requires the local machine"
              continue
            fi
            if [[ "$test" == dotfiles/bin/firn.test.sh ]]; then
              [[ "$FIRN_TEST_SUITE" == runtime ]] || continue
            else
              [[ "$FIRN_TEST_SUITE" == discovered ]] || continue
              shard=$((index % FIRN_TEST_SHARDS))
              index=$((index + 1))
              [[ "$shard" == "$FIRN_TEST_SHARD" ]] || continue
            fi
            echo "::group::$test"
            bash "$test" || { echo "::error::$test failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"
