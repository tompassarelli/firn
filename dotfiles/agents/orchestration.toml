# How agent work is staffed, hand-edited by Tom. `agents plan` combines this
# file with the providers signed in on this machine and prints the bands every
# session staffs from. Skills keep each provider's facts (model ids, how to
# spawn).

# split: use every signed-in provider.
# claude-only or codex-only: drop the other provider even when signed in.
mode = "split"

# Thresholds `agents plan` derives each account's burn/even/conserve state
# from, against the live `agents usage` snapshot (routing.py applies them).
usage = { burn_slack = 15, conserve_slack = -5, horizon_h = 36, money_ceiling = 95, fast_floor = 10, stale_min = 30, urgent = 1.2, shift = 15, late = 1.5 }

# Per-project intent, Tom's to set: priority (1 first), bar (prototype, solid
# or critical), and optionally share (% of each plan window) and target (a
# date or boxes/day).
[projects.galileo]
priority = 1
bar = "solid"

[projects.smashcraft]
priority = 2
bar = "solid"

[projects.nexus]
priority = 3
bar = "solid"

[projects.north]
priority = 4
bar = "solid"

[projects.tooling]
priority = 5
bar = "solid"

[projects.mail]
priority = 6
bar = "solid"

[projects.wisp]
priority = 7
bar = "solid"

# An account state override carries an expiry and is ignored once it passes:
# [accounts.codex]
# state = "conserve"
# until = "2026-10-17T09:20Z"

# Telemetry detail, per tier or on_request table: `detail = "routine"` (the
# default) records one run row per worker; `detail = "profile"` also records
# its per-turn events (each turn, tool error and retried command) in
# threads' run_events, from that tier's next run on.

# Worker tiers, weakest first, as `provider:name`. Difficulty is a percentile
# of Tom's work. `start` is where the tier begins taking work under each
# project bar: [prototype, solid, critical]. A tier takes work from its
# start up to the next tier's start. When columns disagree so a stronger tier
# would start below a weaker one, the larger start wins, so a provider in
# efficiency gives work up rather than taking more. A provider that is
# unavailable hands its range to the next stronger tier (weaker, if none is
# stronger), so a cheap tier never inherits harder work.
# A failed box goes to the next tier in this list, then to Tom.
# `agent` is the Claude Code agent type that runs the tier.

# Mechanical work: exact edits, ticking and closing issues, running a named
# check, lookups in large logs, triage. Never senior work.
[tiers."claude:haiku"]
model = "claude-haiku-5-5"
effort = "high"
agent = "worker-haiku"
role = "mechanical"
start = [0, 0, 0]

# The easier half of the middle: features, fixes with a known cause, tooling,
# docs and skills.
[tiers."codex:sol-medium"]
model = "gpt-6.1-sol"
effort = "medium"
role = "middle"
start = [30, 20, 20]

# The harder half of SOL's range: multi-step or ambiguous middle work.
# Efficiency stretches it to the 85th percentile; performance starts it at
# the 40th.
[tiers."codex:sol-high"]
model = "gpt-6.1-sol"
effort = "high"
role = "middle, harder half"
start = [55, 50, 40]

# The default Opus worker for the whole top range: senior-plus execution,
# unknown-cause debugging, netcode, determinism, engine, cross-module changes,
# planning and architecture. Performance hands it work from the 50th.
[tiers."claude:opus-medium"]
model = "claude-opus-5-5"
effort = "medium"
agent = "worker"
role = "top, planning and architecture"
start = [85, 75, 50]

# Escalation only (Tom, 9 Oct): no band starts here. It takes work an Opus
# medium worker failed or left unfinished through an execution problem.
[tiers."claude:opus-high"]
model = "claude-opus-5-5"
effort = "high"
agent = "worker-high"
role = "escalation after an Opus medium execution failure"
start = [100, 100, 100]

# Escalation only, after an Opus high execution failure.
[tiers."claude:opus-xhigh"]
model = "claude-opus-5-5"
effort = "xhigh"
agent = "worker-xhigh"
role = "escalation after an Opus high execution failure"
start = [100, 100, 100]

# Used only when Tom names the model; never in a band or the escalation.
# 9 Oct: Astra drains Tom's usage and SOL is good enough.
[on_request."codex:astra"]
model = "gpt-6-astra"
effort = "xhigh"
