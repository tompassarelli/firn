name: north-bridge
version: "0.1.0"
kind: standalone
description: >-
  Nix-owned Hermes controller adapter for the North/Orchestration operating model.
  pre_tool_call runs the provider-neutral authoring guard CHAINS from
  ~/.agents/hooks — code-upstream-guard + firn-guard + north-clock-guard for
  write_file/patch, tripwire-guard + firn-guard + north-clock-guard for
  terminal/process — and DENIES the tool whenever any member denies (non-zero
  exit OR a permissionDecision=deny JSON envelope on stdout), is unavailable,
  times out, returns malformed output, or raises. Native delegate_task is
  refused outright (the delegation toolset is off; delegation flows through
  North, not Hermes' own subagent spawner) — a blocked native delegation is
  never marked delegated. Session/tool lifecycle drives the exact WRAPPED North
  hook scripts (north-on-spawn / north-on-tooluse / north-on-stop /
  north-mark-delegated) with the provider env UNSET so North records the
  provider unobserved; north-mark-delegated fires only when a real
  mcp__north__spawn / mcp__north__dispatch succeeds. north-on-tooluse /
  north-on-spawn additionalContext is preserved through transform_tool_result
  (keyed by tool_call_id) and pre_llm_call, and north-on-stop's keep-going
  decision block is mapped through pre_verify. A startup self-check proves the
  enforcement surface resolves; if it does not, authoring/terminal deny.
author: "nixos-config firn Hermes adapter (guards shared from provider-neutral ~/.agents/hooks)"
hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result
  - pre_llm_call
  - pre_verify
  - on_session_start
  - on_session_end
