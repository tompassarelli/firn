# Provider-specific Codex settings. Shared operating instructions live in
# ../agents/AGENTS.md and shared lifecycle policy lives in ../agents/hooks/.
project_doc_fallback_filenames = ["CLAUDE.md"]
default_permissions = ":danger-full-access"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "user"
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[projects."/home/tom"]
trust_level = "trusted"

[projects."/home/tom/code/client/msa/kea"]
trust_level = "trusted"

[projects."/home/tom/code/nixos-config"]
trust_level = "trusted"

[projects."/home/tom/code/north"]
trust_level = "trusted"

[projects."/tmp"]
trust_level = "trusted"

[projects."/home/tom/code/beagle"]
trust_level = "trusted"

[projects."/home/tom/code/fram"]
trust_level = "trusted"

[tui.model_availability_nux]
"gpt-5.6-terra" = 1

[features]
hooks = true

[mcp_servers.north]
command = "/home/tom/code/north/bin/north-mcp"
startup_timeout_sec = 15

[mcp_servers.north.env]
FRAM_LOG = "/home/tom/.local/state/north/coordination.log"
FRAM_TELEMETRY_LOG = "/home/tom/.local/state/north/telemetry.log"
FRAM_THREADS = "/home/tom/.local/state/north/threads"
NORTH_PORT = "7977"

[mcp_servers.fram]
command = "/home/tom/code/fram/bin/fram-mcp"
startup_timeout_sec = 15

[mcp_servers.fram.env]
FRAM_LOG = "/home/tom/.local/state/north/coordination.log"
FRAM_TELEMETRY_LOG = "/home/tom/.local/state/north/telemetry.log"
FRAM_THREADS = "/home/tom/.local/state/north/threads"

[mcp_servers.linear-mcp-msa-new]
url = "https://mcp.linear.app/mcp"
auth = "oauth"
enabled_tools = ["get_issue", "list_issues", "save_issue", "list_comments", "save_comment"]

