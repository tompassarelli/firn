# Provider-specific Codex settings. Shared operating instructions and
# lifecycle policy are composed by North and exposed through ~/.agents/.
project_doc_fallback_filenames = ["CLAUDE.md"]
default_permissions = ":danger-full-access"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "user"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
max_concurrent_threads_per_session = 16
default_subagent_model = "gpt-5.6-luna"

[projects."/home/tom"]
trust_level = "trusted"

[projects."/home/tom/code"]
trust_level = "trusted"

[projects."/home/tom/code/clients/msa/kea/main"]
trust_level = "trusted"

[projects."/home/tom/code/nixos-config"]
trust_level = "trusted"

[projects."/home/tom/code/north"]
trust_level = "trusted"

[projects."/tmp"]
trust_level = "trusted"

[projects."/home/tom/code/beagle"]
trust_level = "trusted"

[tui.model_availability_nux]
"gpt-5.6-terra" = 1
"gpt-5.6-sol" = 1

[features]
hooks = true

[mcp_servers.north]
command = "/run/current-system/sw/bin/north-mcp"
startup_timeout_sec = 15

[mcp_servers.north.env]
BEAGLE_STORE_LOG = "/home/tom/.local/state/north/coordination.log"
BEAGLE_STORE_TELEMETRY_LOG = "/home/tom/.local/state/north/telemetry.log"
BEAGLE_STORE_THREADS = "/home/tom/.local/state/north/threads"
NORTH_PORT = "7977"

[mcp_servers.linear-mcp-msa-new]
url = "https://mcp.linear.app/mcp"
auth = "oauth"
enabled_tools = ["get_issue", "list_issues", "save_issue", "list_comments", "save_comment"]

[mcp_servers.digitalocean]
command = "/run/current-system/sw/bin/bash"
args = ["-c", 'export DIGITALOCEAN_API_TOKEN="$(</home/tom/do-token.txt)"; exec /run/current-system/sw/bin/npx -y @digitalocean/mcp@1.0.67 --services accounts,droplets,networking,volumes']
startup_timeout_sec = 60
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"

[notice]
hide_full_access_warning = true
