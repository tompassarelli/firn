allow_managed_hooks_only = true
allow_remote_control = false
managed_hook_failure_mode = "block"

[features]
hooks = true

[hooks]
managed_dir = "/etc/codex/hooks"

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/beagle-session-start.sh"
timeout = 30

[[hooks.SessionStart.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/north-on-spawn-codex"
timeout = 15

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/north-on-spawn-codex"
timeout = 15

[[hooks.PreToolUse]]
matcher = "^(Agent|Task|Workflow)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/agent-spawn-guard.sh"
timeout = 10

[[hooks.PreToolUse]]
matcher = "^(Edit|Write|MultiEdit|apply_patch)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/firn-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/launch-critical-worktree-guard.sh"
timeout = 10

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/agent-spawn-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/tripwire-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/firn-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/launch-critical-worktree-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/corpus-scan-guard.sh"
timeout = 10

[[hooks.PostToolUse]]
matcher = "^Bash$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/node /etc/codex/hooks/logcompress-hook.js"
timeout = 10

[[hooks.PostToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/north-on-tooluse-codex"
timeout = 10

[[hooks.PostToolUse]]
matcher = "^(Edit|Write|MultiEdit|apply_patch)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/north-on-tooluse-codex"
timeout = 10

[[hooks.PostToolUse]]
matcher = "^(mcp__north__spawn|mcp__north__dispatch|Task|Agent)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/north-mark-delegated-codex"
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/north-on-stop-codex"
timeout = 10
