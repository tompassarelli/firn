allow_managed_hooks_only = true
allow_remote_control = false
managed_hook_failure_mode = "block"

[features]
hooks = true

[hooks]
managed_dir = "/etc/codex/hooks"

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/beagle-session-start.sh"
timeout = 30

[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV /etc/codex/hooks/runtime/bash /etc/codex/hooks/firn-system-policy"
timeout = 10

[[hooks.PreToolUse]]
matcher = "^(Edit|Write|MultiEdit|apply_patch)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/launch-critical-worktree-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/concrete-model-identity-guard.sh"
timeout = 10

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/tripwire-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/launch-critical-worktree-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/corpus-scan-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/resource-safe-search-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/session-kill-guard.sh"
timeout = 10

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/bin:/run/current-system/sw/bin /etc/codex/hooks/runtime/bash /etc/codex/hooks/concrete-model-identity-guard.sh"
timeout = 10
