allow_managed_hooks_only = true
allow_remote_control = false

[features]
hooks = true

[hooks]
managed_dir = "/etc/codex/hooks"

[[hooks.PreToolUse]]
matcher = "^(Write|Edit|MultiEdit|apply_patch|functions[.]apply_patch|Bash|exec_command|functions[.]exec_command|shell|shell_command)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/runtime/env -u BASH_ENV -u ENV PATH=/etc/codex/hooks/runtime:/home/tom/.local/share/firn/bin:/home/tom/.local/share/north/bin:/home/tom/.local/share/south/bin:/run/current-system/sw/bin north hook language-guard"
timeout = 60

